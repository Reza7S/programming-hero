<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
/* Base Layout Reset */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* 🧱 Main Grid Setup */
.grid-container {
    display: grid;
    /* Create 3 equal columns */
    grid-template-columns: repeat(3, 1fr); 
    /* Create 2 equal rows */
    grid-template-rows: repeat(2, 200px); 
    gap: 10px; /* Space between the blocks */
    max-width: 800px;
    margin: 20px auto;
    background-color: #fff;
}

/* Shared Box Styling */
.box {
    border-radius: 6px;
    color: white;
    font-family: 'Courier New', Courier, monospace; /* Matches style in image */
    font-size: 2rem;
    font-weight: bold;
    padding: 15px;
}

/* 📐 Individual Box Positioning and Colors */

.box-1 {
    background-color: #e61d66; /* Magenta Pink */
    grid-column: 1 / 2;       /* Occupies the first column */
    grid-row: 1 / 3;          /* Spans across both row 1 and row 2 */
}

.box-2 {
    background-color: #fca11a; /* Orange */
    grid-column: 2 / 4;       /* Spans across column 2 and column 3 */
    grid-row: 1 / 2;          /* Stays in row 1 */
}

.box-3 {
    background-color: #a639be; /* Purple */
    grid-column: 2 / 3;       /* Occupies column 2 */
    grid-row: 2 / 3;          /* Stays in row 2 */
}

.box-4 {
    background-color: #556a77; /* Slate Blue/Grey */
    grid-column: 3 / 4;       /* Occupies column 3 */
    grid-row: 2 / 3;          /* Stays in row 2 */
}
/* 📱 Responsive Mobile Breakpoint (Screens 600px wide or smaller) */
@media (max-width: 600px) {
    .grid-container {
        /* Change grid structure to a single vertical column */
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, 160px); /* Sets height for each block */
    }

    /* Reset positioning rules so boxes flow naturally in order (1, 2, 3, 4) */
    .box-1, .box-2, .box-3, .box-4 {
        grid-column: auto;
        grid-row: auto;
    }
}


    </style>
</head>
<body>
<div class="grid-container">
    <div class="box box-1">1</div>
    <div class="box box-2">2</div>
    <div class="box box-3">3</div>
    <div class="box box-4">4</div>
</div>

</body>
</html>
