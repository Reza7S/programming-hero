<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            border: 3px solid black;
            border-radius: 10px;
            padding: 10px;
            max-width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

        }

        .left-box,
        .right-box {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 500px;
            /* border: 1px solid tan; */
            border-radius: 10px;
            font-size: 2rem;
        }
        .left-box{
            flex: 1;
            background-color: #d3d3d3; 
        }
        .right-box{
            flex: 2.3;
            background-color: #fbf9e6; 
        }

        @media screen and (max-width:576px) {
            .container{
                flex-direction: column;
                min-height: 500px;
            }
            .left-box, .right-box{
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left-box">Left</div>
        <div class="right-box">Right</div>
    </div>
</body>

</html>
