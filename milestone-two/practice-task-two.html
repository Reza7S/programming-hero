<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 200px);
            gap: 10px;

        }

        .box {
            border-radius: 10px;
            padding: 10px;
            font-size: 2rem;
        }

        .box-1 {
            background-color: #e61d66;
            grid-column: 1 / 3;
            grid-row: 1/3;

        }

        .box-2 {
            background-color: #fca11a;
            grid-column: 3/5;
            grid-row: 1/2;
        }

        .box-3 {
            background-color: #a639be;
            grid-column: 3/4;
            grid-row: 2/3;
        }

        .box-4 {
            background-color: #556a77;
            grid-column: 4/5;
            grid-row: 2/3;
        }

        @media screen and (max-width:576px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(4, 300px);
            }

            .box-1,
            .box-2,
            .box-3,
            .box-4 {
                grid-column: auto;
                grid-row: auto;
            }

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box box-1">1</div>
        <div class="box box-2">2</div>
        <div class="box box-3">3</div>
        <div class="box box-4">4</div>
    </div>
</body>

</html>
