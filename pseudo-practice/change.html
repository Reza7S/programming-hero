<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo</title>

    <style>
        p{
            background-color: black;
        }
        p:hover{
            background-color: white;
        }
        input:focus{
            color: rgb(87, 8, 15);
            outline: 2px solid peru;  
        }
        a:visited{
            color: azure;
        }
        li:nth-child(2n+1){
            text-transform: capitalize;
            color: brown;
        }
    </style>
</head>

<body>
    <p>Anwar</p>

    <input type="text"><br>

    <a href="http://127.0.0.1:5500/pseudo-practice/change.html">Pseudo</a>
    <br>

    <ul>
        <li>a</li>
        <li>b</li>
        <li>c</li>
        <li>d</li>
        <li>e</li>
        <li>f</li>
        <li>g</li>
        <li>h</li>
        <li>i</li>
        <li>j</li>
    </ul>
</body>

</html>
